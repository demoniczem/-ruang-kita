<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruang Kita</title>
<style>
:root{--pink:#8d4668;--pale:#f3dce7;--ink:#392631;--bg:#fff7fa}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Trebuchet MS",sans-serif;color:var(--ink);background:var(--bg)}
.app{min-height:100vh;display:flex;justify-content:center;padding:16px}
.chat{width:min(100%,760px);min-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden;border:1px solid #e8cbd9;border-radius:24px;background:#fff;box-shadow:0 14px 40px #6c36501a}
header{display:flex;align-items:center;gap:12px;padding:18px 20px;color:white;background:var(--pink)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#ffffff2c;font-size:22px}
h1{font-size:1.35rem;margin:0}.sub{font-size:12px;opacity:.85;margin-top:3px}
.badge{margin-left:auto;font-size:11px;border:1px solid #ffffff70;padding:6px 9px;border-radius:20px}
main{flex:1;padding:22px clamp(14px,4vw,30px);display:flex;flex-direction:column;gap:14px;overflow:auto;background:linear-gradient(135deg,#fff7fa,#f9eaf1)}
.date{align-self:center;font-size:11px;color:#916b7e;background:#f7e8ef;padding:6px 11px;border-radius:20px}
.msg{max-width:82%;padding:12px 15px;border-radius:18px;line-height:1.45;font-size:14px;box-shadow:0 2px 7px #4d26300b;overflow-wrap:anywhere}
.them{align-self:flex-start;background:#fff;border-bottom-left-radius:5px}
.me{align-self:flex-end;background:var(--pale);color:#51283d;border-bottom-right-radius:5px}
.time{font-size:10px;opacity:.6;text-align:right;margin-top:5px}
footer{padding:14px;display:flex;gap:9px;align-items:center;border-top:1px solid #ead5df;background:#fff}
input[type=text]{min-width:0;flex:1;border:1px solid #e5cbd8;background:#fff;color:var(--ink);border-radius:22px;padding:13px 16px;font:inherit;outline:none}
button,.file-label{border:0;border-radius:50%;width:44px;height:44px;display:grid;place-items:center;background:var(--pink);color:white;font-size:19px;cursor:pointer}
.file-label{flex:0 0 44px}#photo{display:none}
.preview{max-width:210px;max-height:260px;object-fit:contain;border-radius:12px;display:block;margin-top:8px}
.note{text-align:center;font-size:11px;opacity:.65;padding:0 18px 12px}
@media(max-width:480px){.app{padding:0}.chat{min-height:100vh;border-radius:0;border:0}.msg{max-width:90%}}
</style>
</head>
<body>
<div class="app"><section class="chat" aria-label="Ruang chat">
<header><div class="avatar">💗</div><div><h1>Ruang Kita</h1><div class="sub">tempat ngobrol santai ✨</div></div><div class="badge">DEMO</div></header>
<main id="messages" aria-live="polite">
<div class="date">Hari ini</div>
<div class="msg them">Haiii 😊 Selamat datang di ruang kecil kita!<div class="time">—</div></div>
<div class="msg me">Akhirnya punya tampilan chat sendiri 💕<div class="time">—</div></div>
<div class="msg them">Coba kirim pesan atau pilih foto di bawah ya.<div class="time">—</div></div>
</main>
<footer><label class="file-label" for="photo" title="Pilih foto">＋</label><input id="photo" type="file" accept="image/*"><input id="entry" type="text" placeholder="Tulis pesan..." autocomplete="off" aria-label="Tulis pesan"><button id="send" aria-label="Kirim">➤</button></footer>
<div class="note">Demo tampilan: pesan dan foto hanya tersimpan sementara di halaman ini.</div>
</section></div>
<script>
const messages = document.getElementById('messages');
const entry = document.getElementById('entry');
const sendButton = document.getElementById('send');

function addMessage(content, sender = 'me', isPhoto = false) {
  const bubble = document.createElement('div');
  bubble.className = 'msg ' + sender;

  if (isPhoto) {
    const img = document.createElement('img');
    img.className = 'preview';
    img.alt = 'Foto yang dipilih';
    img.src = content;
    bubble.appendChild(img);
  } else {
    bubble.appendChild(document.createTextNode(content));
  }

  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = new Date().toLocaleTimeString('id-ID', {
    hour: '2-digit',
    minute: '2-digit'
  });

  bubble.appendChild(time);
  messages.appendChild(bubble);
  messages.scrollTop = messages.scrollHeight;
}

async function send() {
  const value = entry.value.trim();
  if (!value) return;

  addMessage(value, 'me');
  entry.value = '';
  sendButton.disabled = true;

  const loading = document.createElement('div');
  loading.className = 'msg them';
  loading.textContent = 'Sedang mengetik...';
  messages.appendChild(loading);

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: value })
    });

    const data = await response.json();
    loading.remove();

    if (!response.ok) {
      throw new Error(data.error || 'Gagal menghubungi AI');
    }

    addMessage(data.reply || 'Belum ada jawaban.', 'them');
  } catch (error) {
    loading.remove();
    addMessage('Maaf, terjadi kesalahan: ' + error.message, 'them');
  } finally {
    sendButton.disabled = false;
    entry.focus();
  }
}

sendButton.addEventListener('click', send);

entry.addEventListener('keydown', event => {
  if (event.key === 'Enter') send();
});

document.getElementById('photo').addEventListener('change', event => {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => addMessage(reader.result, 'me', true);
  reader.readAsDataURL(file);
  event.target.value = '';
});
</script>
</body></html>
